plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ---------------------------------------------------------------------------
// Version code resolution
//
// CI/deploy pipelines sometimes inject their own (low) --build-number, which
// collides with version codes already consumed on Google Play. To keep uploads
// monotonic we take the highest of:
//   * the build number declared in pubspec.yaml (source of truth)
//   * whatever Flutter resolved (flutter.versionCode)
//   * MIN_PLAY_VERSION_CODE, a floor above everything already on Play
// ---------------------------------------------------------------------------
def MIN_PLAY_VERSION_CODE = 350

def pubspecBuildNumber = 0
def pubspecVersionName = null
def pubspecFile = file("../../pubspec.yaml")
if (pubspecFile.exists()) {
    def versionLine = pubspecFile.readLines().find { it.trim().startsWith("version:") }
    if (versionLine != null) {
        def raw = versionLine.split(":", 2)[1].trim().replaceAll("[\"']", "")
        def parts = raw.split("\\+")
        pubspecVersionName = parts[0].trim()
        if (parts.length > 1) {
            try { pubspecBuildNumber = parts[1].trim().toInteger() } catch (ignored) { }
        }
    }
}

def flutterCode = 0
try { flutterCode = (flutter.versionCode ?: 0) as int } catch (ignored) { }

def resolvedVersionCode = [pubspecBuildNumber, flutterCode, MIN_PLAY_VERSION_CODE].max()
def resolvedVersionName = (pubspecVersionName ?: flutter.versionName ?: "1.0.0")

println "[nymbot] resolved Android versionCode=${resolvedVersionCode} versionName=${resolvedVersionName} (pubspec=${pubspecBuildNumber}, flutter=${flutterCode}, floor=${MIN_PLAY_VERSION_CODE})"

android {
    namespace = "ai.nymbot"
    compileSdk = 36
    // Use NDK r27+ for 16 KB page-size support
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required for libraries that use newer Java APIs on older Android versions
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }

    defaultConfig {
        applicationId "ai.nymbot"
        // Pinned in-repo rather than taken from flutter.minSdkVersion, so the
        // floor cannot drift with the SDK. 24 is what the keystore-backed
        // secure storage needs.
        minSdk = 24
        targetSdk = 36
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
        
        // Support all ABIs - AGP 8.9.1 automatically handles 16 KB alignment
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
    
    // Support for 16 KB page sizes: do not extract native libs
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Enable Java 8+ API desugaring across app and transitive dependencies
    // This satisfies AAR metadata requirements from flutter_local_notifications
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
}
