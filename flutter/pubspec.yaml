name: nymbot
description: "Nymbot — a private AI assistant. No account, end-to-end encrypted, paid in sats."
publish_to: "none"
version: 1.0.7+374
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any

  # Nostr / crypto. The same set the Nymchat client uses, because the wire
  # format is shared: bip340 signs, coinlib's bundled libsecp256k1 verifies and
  # provides the raw-X ECDH NIP-44 needs, and pointycastle/cryptography carry
  # ChaCha20-Poly1305, SHA-3 and SHAKE for ML-KEM.
  bip340: ^0.3.0
  coinlib: ^5.0.0
  coinlib_flutter: ^5.0.1
  ffi: ^2.1.0
  pointycastle: ^3.9.1
  cryptography: ^2.7.0
  convert: ^3.1.1
  crypto: ^3.0.5
  bech32: ^0.2.2

  web_socket_channel: ^3.0.1
  http: ^1.0.0
  path_provider: ^2.1.6

  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  local_auth: ^3.0.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

  qr_flutter: ^4.1.0
  url_launcher: any

  # The chat surface: attachments off the device, a reply read back out, and a
  # transcript handed to whatever the platform shares with.
  file_picker: ^11.0.3
  flutter_tts: ^4.2.0
  share_plus: ^12.0.2
  image: ^4.10.1
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/nymbot-icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # One assets: key only — a second one silently replaces the first rather
  # than adding to it, which would drop whichever list came earlier.
  #
  # assets/i18n is written by `npm run build` from the shared translation
  # cache. `index.json` is always present (an empty list when nothing is
  # published yet), so the bundle is valid in a checkout never built.
  assets:
    - assets/images/
    - assets/i18n/
