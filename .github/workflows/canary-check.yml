name: Warrant canary check

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: canary
        run: npm run canary:check
      - name: Fail when the canary is due or overdue
        if: steps.canary.outputs.status == 'soon' || steps.canary.outputs.status == 'overdue'
        run: |
          {
            echo "### Warrant canary needs signing"
            echo ""
            echo "- Status: ${{ steps.canary.outputs.status }}"
            echo "- Due: ${{ steps.canary.outputs.due }}"
            echo ""
            echo "Run \`NOSTR_NSEC=... npm run canary:sign\` and commit canary.json."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Warrant canary is ${{ steps.canary.outputs.status }} (due ${{ steps.canary.outputs.due }})"
          exit 1
